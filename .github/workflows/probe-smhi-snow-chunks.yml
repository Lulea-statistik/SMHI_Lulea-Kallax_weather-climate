name: Probe SMHI snow app chunks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-smhi-snow-chunks.yml"
      - "scripts/probe_smhi_snow_chunks.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe dynamic snow app chunks
        run: python scripts/probe_smhi_snow_chunks.py
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_chunks_probe.json
          git commit -m "Record SMHI snow dynamic chunk probe"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
