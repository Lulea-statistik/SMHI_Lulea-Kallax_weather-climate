name: Probe Copernicus snow S3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-copernicus-snow-s3.yml"
      - "scripts/probe_copernicus_snow_s3.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 mgrs packaging
      - name: Probe HR-WSI S3
        run: python scripts/probe_copernicus_snow_s3.py
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/copernicus_snow_s3_probe.json
          git commit -m "Record Copernicus snow S3 probe"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
