name: Test SMHI snow CRS symmetric
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-smhi-snow-crs-symmetric.yml"
      - "scripts/test_smhi_snow_crs_symmetric.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy scipy pyshp pyproj
      - run: python scripts/test_smhi_snow_crs_symmetric.py
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_crs_symmetric.json
          git commit -m "Record symmetric SMHI snow CRS fit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
