name: Import SMHI historical land warnings
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smhi-historical-land-warnings
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import dependencies
        run: pip install requests==2.32.5 openpyxl==3.1.5
      - name: Download official SMHI workbook and inventory fields
        run: python scripts/import_smhi_historical_warnings.py
      - name: Commit source workbook and inventory
        shell: bash
        run: |
          git add data/warning_history_smhi/official_land_warnings_2021_2025.xlsx docs/warnings/historical_inventory.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import official SMHI historical land warning inventory"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
