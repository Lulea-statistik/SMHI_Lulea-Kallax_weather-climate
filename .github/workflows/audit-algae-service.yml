name: Audit SMHI algae class definitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests Pillow
      - name: Inspect WFS/WMS schemas and two dates
        run: python scripts/audit_algae_service.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algae-service-audit
          path: algae-service-audit/
          if-no-files-found: warn
          retention-days: 30
