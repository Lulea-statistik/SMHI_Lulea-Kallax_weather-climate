name: Audit SMHI algae classes within Lulea sea

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install requests shapely pyproj
      - name: Clip selected WFS classes to Lulea NMD sea
        run: python scripts/audit_algae_lulea_sea_classes.py
      - name: Upload local sea audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algae-lulea-sea-class-audit
          path: algae-service-audit/lulea-sea-class-audit.json
          if-no-files-found: warn
          retention-days: 30
