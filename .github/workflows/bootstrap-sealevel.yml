name: Bootstrap SMHI water level - Stromoren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-sealevel.yml'
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Water-level-only execution"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - update

permissions:
  contents: write

concurrency:
  group: smhi-stromoren-waterlevel
  cancel-in-progress: false

jobs:
  water-level:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download water-level observations only
        env:
          RUN_MODE: ${{ inputs.mode || 'update' }}
        run: python scripts/fetch_sealevel_stromoren.py --mode "$RUN_MODE"
      - name: Build water-level summaries
        run: python scripts/build_sealevel.py
      - name: Verify published summary exists and contains annual data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/sealevel/stromoren.json')
          if not path.is_file():
              raise SystemExit('Missing docs/sealevel/stromoren.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not data.get('annual') or not data.get('daily') or not data.get('monthly'):
              raise SystemExit('Sea-level output contains no chart data')
          print('Water-level summary verified:', len(data['annual']), 'annual rows')
          PY
      - name: Commit only water-level data
        shell: bash
        run: |
          git add data/sealevel/stromoren/ docs/sealevel/stromoren.json
          if git diff --cached --quiet; then
            echo "No water-level changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bootstrap Strömören RH 2000 sea level observations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
