name: Bootstrap SMHI water level - Stromoren

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Water-level-only execution"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - update

permissions:
  contents: write

concurrency:
  group: smhi-stromoren-waterlevel
  cancel-in-progress: false

jobs:
  water-level:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download water-level observations only
        env:
          RUN_MODE: ${{ inputs.mode }}
        run: python scripts/fetch_sealevel_stromoren.py --mode "$RUN_MODE"
      - name: Commit only water-level data
        shell: bash
        run: |
          git add data/sealevel/stromoren/
          if git diff --cached --quiet; then
            echo "No water-level changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bootstrap Strömören RH 2000 sea level observations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
