name: Diagnose recent snow grid

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-recent-snowgrid.yml"
      - "scripts/diagnose_recent_snowgrid.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose recent snow grids
        run: python scripts/diagnose_recent_snowgrid.py
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/recent_snow_diagnostic.json
          git commit -m "Record recent snow grid diagnostic"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
