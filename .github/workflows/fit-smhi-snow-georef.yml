name: Fit SMHI snow georeference

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fit-smhi-snow-georef.yml"
      - "scripts/fit_smhi_snow_georef.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy scipy pyshp
      - name: Fit SMHI image to SCB county borders
        run: python scripts/fit_smhi_snow_georef.py
      - name: Commit fit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_georef_fit.json
          git commit -m "Record SMHI snow georeference fit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
