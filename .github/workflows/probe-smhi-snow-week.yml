name: Probe SMHI current snow data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-smhi-snow-week.yml"
      - "scripts/probe_smhi_snow_week.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe current SMHI snow API
        run: python scripts/probe_smhi_snow_week.py
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_week_probe.json
          git commit -m "Record current SMHI snow API probe"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
