name: Build recent snow grid

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-recent-snowgrid.yml"
      - "scripts/build_recent_snowgrid.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smhi-snowgrid-bootstrap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build 2018 onward interpolated snow grid
        run: python scripts/build_recent_snowgrid.py
      - name: Commit recent snow grid
        shell: bash
        run: |
          if [ -z "$(git status --porcelain docs/snowgrid)" ]; then
            echo "No recent snow-grid changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid
          git commit -m "Build recent interpolated snow grid"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
