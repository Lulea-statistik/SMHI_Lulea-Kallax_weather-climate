name: Build SMHI snow Lulea georef preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-smhi-snow-lulea-preview.yml"
      - "scripts/build_smhi_snow_lulea_georef_preview.py"
      - "docs/snowgrid/smhi_snow_crs_candidates.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy pyshp pyproj
      - run: python scripts/build_smhi_snow_lulea_georef_preview.py
      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_lulea_georef_preview.png docs/snowgrid/smhi_snow_lulea_georef_preview.json
          git commit -m "Add Lulea SMHI snow georef preview"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
