name: Climate dashboard quality checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in docs/*.js; do node --check "$file"; done
      - name: Check data and internal resources
        run: python scripts/check_dashboard_quality.py
