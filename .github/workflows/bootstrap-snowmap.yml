name: Bootstrap SMHI snow-depth map

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-snowmap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smhi-snowmap-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-snowmap:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build complete snow-depth observation history
        run: python scripts/fetch_snowmap.py

      - name: Commit snow-depth map data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain docs/snowmap docs/snowmap_boundary.geojson)" ]; then
            echo "No snow-map changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowmap docs/snowmap_boundary.geojson
          git commit -m "Bootstrap SMHI snow-depth map history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
