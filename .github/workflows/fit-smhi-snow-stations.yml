name: Fit SMHI snow station georeference

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fit-smhi-snow-stations.yml"
      - "scripts/fit_smhi_snow_station_georef.py"
      - "docs/snowgrid/smhi_snow_obs_components.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pyproj
      - run: python scripts/fit_smhi_snow_station_georef.py
      - name: Commit station fit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_station_georef.json
          git commit -m "Record SMHI snow station georeference fit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
