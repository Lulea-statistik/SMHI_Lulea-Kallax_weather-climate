name: Check SCB Lulea CRS equivalence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-scb-lulea-crs.yml"
      - "scripts/check_scb_lulea_crs_equivalence.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pyshp pyproj
      - run: python scripts/check_scb_lulea_crs_equivalence.py
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/scb_lulea_crs_equivalence.json
          git commit -m "Record Lulea CRS equivalence check"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
