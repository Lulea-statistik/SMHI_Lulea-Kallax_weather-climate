name: Discover additional SMHI algae classes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install requests Pillow shapely
      - name: Search Baltic WFS class codes and sample WMS colors
        run: python scripts/audit_algae_additional_classes.py
      - name: Save discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algae-additional-classes-audit
          path: algae-service-audit/additional-classes-audit.json
          if-no-files-found: warn
          retention-days: 30
