name: Update SMHI Kallax weather data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Körläge"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - bootstrap
          - update
          - refresh-all
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: smhi-kallax-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and merge SMHI observations
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/fetch_smhi.py --mode "$RUN_MODE"

      - name: Build static lightning geography
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/build_lightning_geography.py

      - name: Update SMHI lightning archive
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/fetch_lightning.py

      - name: Build lightning density map
        run: python scripts/build_lightning_map.py

      - name: Update SMHI sea ice history
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/fetch_seaice.py

      - name: Update SMHI algae map test
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/fetch_algae.py

      - name: Update SMHI snow-depth map
        run: python scripts/fetch_snowmap.py

      - name: Build GitHub Pages report data
        run: python scripts/build_dashboard_data.py

      - name: Commit updated data and report
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data metadata docs/dashboard_data.json docs/daily docs/seaice_analysis_area.geojson docs/algae docs/snowmap docs/snowmap_boundary.geojson docs/lightning_map
          if [ -f docs/seaice_test_2023-12-14.geojson ]; then
            git add docs/seaice_test_2023-12-14.geojson
          fi
          if [ -d docs/seaice/2023-24 ]; then
            git add docs/seaice/2023-24
          fi
          git commit -m "Update SMHI Kallax observations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate data coverage
        run: python scripts/validate_run.py
