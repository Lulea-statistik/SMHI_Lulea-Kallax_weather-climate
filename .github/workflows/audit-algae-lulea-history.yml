name: Audit historical SMHI algae classes in Lulea sea

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install requests shapely pyproj
      - name: Audit SMHI WFS class 2 and 3 for 2002-2026
        run: python scripts/audit_algae_lulea_sea_history.py
      - name: Upload historical audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algae-lulea-historical-class-audit
          path: algae-service-audit/lulea-sea-historical-classes-audit.json
          if-no-files-found: warn
          retention-days: 30
