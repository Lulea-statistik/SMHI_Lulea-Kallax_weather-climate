name: Update SMHI Lulea humidity stations

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 1 * *"

permissions:
  contents: write

concurrency:
  group: lulea-humidity-stations
  cancel-in-progress: false

jobs:
  humidity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify parameter 6 stations and build history
        run: python scripts/build_humidity_stations.py
      - name: Commit verified station observations
        shell: bash
        run: |
          git add docs/humidity_stations.json
          if git diff --cached --quiet; then
            echo "No new station observations"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update observed Lulea SMHI relative humidity station series"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload station audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lulea-humidity-stations
          path: docs/humidity_stations.json
          if-no-files-found: warn
          retention-days: 30
