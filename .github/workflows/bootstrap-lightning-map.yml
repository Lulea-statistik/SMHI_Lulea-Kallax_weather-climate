name: Bootstrap lightning density map

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-lightning-map.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightning-density-map-bootstrap
  cancel-in-progress: false

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build all annual lightning maps
        run: python scripts/build_lightning_map.py
      - name: Commit lightning map data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain docs/lightning_map)" ]; then
            echo "No lightning map changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lightning_map
          git commit -m "Bootstrap lightning density map"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
