name: Evaluate SMHI snow CRS Norrbotten

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-smhi-snow-crs-norrbotten.yml"
      - "scripts/evaluate_smhi_snow_crs_norrbotten.py"
      - "docs/snowgrid/smhi_snow_crs_candidates.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy scipy pyshp pyproj
      - run: python scripts/evaluate_smhi_snow_crs_norrbotten.py
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowgrid/smhi_snow_crs_norrbotten_eval.json
          git commit -m "Record Norrbotten CRS evaluation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
